<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зарплата</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зарплата">
<meta name="theme-color" content="#1f6feb">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#1f6feb; --red:#d93025; --green:#188038; --border:#e2e4e8; --orange:#c26401; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1c1f25; --text:#e8eaed; --muted:#9aa0a6; --accent:#4c8dff; --red:#ff6b6b; --green:#4cd07d; --border:#2d313a; --orange:#ffa94d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Roboto,sans-serif; background:var(--bg); color:var(--text);
         padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width:600px; margin-inline:auto; }
  h2 { font-size:16px; margin:0 0 10px; }
  h3 { font-size:15px; margin:12px 0 6px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .weeknav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .weeknav .title { text-align:center; font-weight:600; }
  .weeknav .sub { font-size:13px; color:var(--muted); font-weight:400; }
  button { font:inherit; border:none; border-radius:8px; padding:10px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
  button.del { background:transparent; color:var(--red); padding:6px 8px; }
  button.small { padding:6px 10px; font-size:14px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  label.check { display:flex; gap:8px; align-items:center; font-size:15px; color:var(--text); margin:4px 0; }
  label.check input { width:22px; height:22px; flex-shrink:0; }
  input, select { font:inherit; font-size:16px; width:100%; min-width:0; max-width:100%; height:42px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
  /* iOS Safari: поле даты иначе шире колонки и налезает на соседнее */
  input[type=date], input[type=number], input[type=text] { -webkit-appearance:none; appearance:none; display:block; }
  input::-webkit-date-and-time-value { text-align:left; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .grid > div { min-width:0; }
  .grid .full { grid-column:1 / -1; }
  .tablewrap { overflow-x:auto; margin-top:10px; }
  #byPoint td, #byPoint th { white-space:nowrap; }
  .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .row > * { min-width:0; }
  .row > button { flex-shrink:0; }
  .item { border-top:1px solid var(--border); padding:10px 0; }
  .item:first-child { border-top:none; padding-top:0; }
  .muted { color:var(--muted); font-size:13px; }
  .big { font-size:24px; font-weight:700; }
  .plus { color:var(--green); } .minus { color:var(--red); } .warn { color:var(--orange); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; text-align:right; border-top:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; border-top:none; }
  td:first-child, th:first-child { text-align:left; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .line { display:flex; justify-content:space-between; gap:10px; padding:4px 0; }
  .line.total { border-top:1px solid var(--border); margin-top:4px; padding-top:8px; font-weight:700; }
  .bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--green); }
  .form { border:1px solid var(--accent); border-radius:10px; padding:12px; margin-top:10px; }
  details { border-top:1px solid var(--border); padding:10px 0; }
  details:first-of-type { border-top:none; }
  summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:10px; font-weight:600; }
  summary::-webkit-details-marker { display:none; }
  .done { color:var(--green); }
</style>
</head>
<body>
<div class="tabs"><button id="tabSalary">Зарплата</button><button id="tabDebts">Долги</button></div>

<!-- ================= ЗАРПЛАТА ================= -->
<div id="salaryView">
  <div class="card weeknav">
    <button class="ghost" id="prev">‹</button>
    <div class="title"><div id="weekTitle"></div><div class="sub" id="payday"></div></div>
    <button class="ghost" id="next">›</button>
  </div>

  <div class="card">
    <h2>Итого к выплате</h2>
    <div class="big" id="total">0 ₸</div>
    <div class="muted" id="totalNote"></div>
    <div class="tablewrap"><table id="byPoint"></table></div>
    <div class="actions" style="margin-top:12px"><button id="copyReport">Скопировать отчёт</button></div>
  </div>

  <div class="card">
    <h2>Куда уходит зарплата</h2>
    <div id="spend"></div>
    <div class="actions" style="margin-top:10px"><button id="payFromWeek">Отдать с этой зарплаты</button></div>
    <div id="payFromWeekForm"></div>
  </div>

  <div class="card">
    <div class="row"><h2>Смены</h2><button id="addShift">+ Смена</button></div>
    <div id="shifts"></div>
  </div>

  <div class="card">
    <div class="row"><h2>Авансы (взял)</h2><button id="addAdv">+ Аванс</button></div>
    <div class="muted" style="margin-bottom:8px">Аванс становится долгом начальнику точки. Гасится через «Отдать с этой зарплаты» → вычет из ЗП.</div>
    <div id="advances"></div>
  </div>
</div>

<!-- ================= ДОЛГИ ================= -->
<div id="debtsView" hidden>
  <div class="card">
    <h2>Осталось отдать</h2>
    <div class="big" id="debtTotal"></div>
    <div class="muted" id="debtTotalAlt"></div>
    <div class="bar"><div id="debtBar"></div></div>
    <div class="muted" id="debtPaid"></div>
    <div id="forecast" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>Сроки</h2>
    <div id="dueList"></div>
  </div>

  <div class="card">
    <div class="row"><h2>Кому должен</h2><button id="addDebt">+ Долг</button></div>
    <div id="addDebtForm"></div>
    <div id="people" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>Настройки</h2>
    <div class="grid">
      <div><label>Курс ₽, ₸ за 1 ₽</label><input type="number" step="0.01" inputmode="decimal" id="rateRUB"></div>
      <div><label>Курс $, ₸ за 1 $</label><input type="number" step="0.01" inputmode="decimal" id="rateUSD"></div>
      <div><label>Еда и дорога в неделю, ₸</label><input type="number" inputmode="numeric" id="foodSet"></div>
    </div>
  </div>
</div>

<!-- ================= ОБЩЕЕ ================= -->
<div class="card">
  <div class="row"><h2>Синхронизация</h2><span class="muted" id="syncStatus"></span></div>
  <div id="syncForm">
    <label for="syncPass">Пароль (тот же на всех устройствах)</label>
    <div class="row"><input type="password" id="syncPass" autocomplete="current-password"><button id="syncOn">Включить</button></div>
  </div>
  <div id="syncOnBox" hidden>
    <div class="actions"><button class="ghost" id="syncNow">Синхронизировать</button><button class="ghost" id="syncOff">Отключить</button></div>
  </div>
</div>

<div class="card">
  <h2>Резервная копия</h2>
  <div class="muted" style="margin-bottom:8px">Сохранить все данные в файл или загрузить из файла.</div>
  <div class="actions">
    <button class="ghost" id="export">Сохранить файл</button>
    <button class="ghost" id="importBtn">Загрузить файл</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>

<script>
const POINTS = ["БЦА", "ДАМУ", "АРУЖАН", "ЖИБЕК", "ТУРАН"];
const PERCENT = 0.20;
const MIN_SALES = 35000;
const MIN_PAY = 7000;
const KEEP_WEEKS = 5;          // текущая + 4 прошлые
const KEY = "salary-data-v1";
const DAYS = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const CUR = { KZT: "₸", RUB: "₽" };

// ---------- даты и числа ----------
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function parse(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(s) { const d = parse(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); }
function fmtDate(s) { const d = parse(s); return DAYS[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0"); }
function dm(s) { return fmtDate(s).slice(3); }
function n(x) { return Math.round(x).toLocaleString("ru-RU"); }
function money(x, cur) { return n(x) + " " + CUR[cur || "KZT"]; }
function today() { return iso(new Date()); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function weekLabel(k) { return dm(k) + "–" + dm(addDays(k, 6)); }

// ---------- хранилище ----------
let data = { weeks: {} };
try { data = JSON.parse(localStorage.getItem(KEY)) || data; } catch (e) {}
if (!data.weeks) data.weeks = {};

// Начальные долги из таблицы (07.11.2026). updatedAt = 0, чтобы не перезаписать данные с сервера.
function seedDebts() {
  const P = (id, name, currency, points) => ({ id, name, currency, points: points || [] });
  const I = (id, personId, title, amount, due) => ({ id, personId, title, amount, date: "2026-11-07", due });
  return {
    updatedAt: 0, migrated: [],
    rates: { RUB: 5.46, USD: 447.14 }, food: 10000,
    people: [
      P("talgat", "Талгат", "KZT", ["БЦА"]),
      P("nursat", "Нурсат", "KZT", ["ДАМУ", "ТУРАН"]),
      P("tleu", "Тлеуберди", "KZT", ["ЖИБЕК", "АРУЖАН"]),
      P("nursultan", "Нурсултан", "KZT"),
      P("raiym", "Райымбек", "KZT"),
      P("vinill", "Винилл", "RUB"),
      P("vadim", "Вадим", "RUB"),
      P("oleg", "Олег", "RUB"),
      P("albert", "Альберт", "RUB"),
    ],
    items: [
      I("seed-tleu", "tleu", "Долг", 45000, "2026-11-23"),
      I("seed-nursat", "nursat", "Долг", 22500, "2026-11-16"),
      I("seed-nursultan", "nursultan", "Долг", 30000, "2026-11-16"),
      I("seed-raiym-pc", "raiym", "За компы", 5000, "2026-11-09"),
      I("seed-raiym-watch", "raiym", "За часы", 30000, "2026-11-16"),
      I("seed-raiym-flat", "raiym", "Квартира (30к прошлый + 100к этот месяц)", 130000, "2026-12-07"),
      I("seed-vinill", "vinill", "Долг", 20000, "2026-11-30"),
      I("seed-vadim", "vadim", "Долг (+4 000 ₽ за ожидание)", 16000, "2026-12-28"),
      I("seed-oleg", "oleg", "Долг (+3 000 ₽ за ожидание)", 16000, "2027-01-18"),
      I("seed-albert", "albert", "Долг", 1300, "2027-01-25"),
    ],
    payments: [],
  };
}
if (!data.debts) data.debts = seedDebts();
const D = () => data.debts;

// Старые авансы из недель переносим в долги начальнику (+ вычет в той же неделе, как считалось раньше)
function migrateAdvances() {
  const d = D(); if (!d.migrated) d.migrated = [];
  for (const [k, w] of Object.entries(data.weeks)) {
    for (const a of (w.advances || [])) {
      if (d.migrated.includes(a.id)) continue;
      d.migrated.push(a.id);
      if (!a.amount) continue;
      const boss = bossOf(a.point);
      d.items.push({ id: "adv-" + a.id, personId: boss.id, title: "Аванс", amount: a.amount, date: a.date, due: "", week: k, point: a.point, advance: true });
      d.payments.push({ id: "pay-adv-" + a.id, personId: boss.id, itemId: "adv-" + a.id, date: addDays(k, 7), amount: a.amount, kzt: a.amount, week: k, deduction: true, point: a.point });
    }
  }
}

function prune() {
  const oldest = addDays(mondayOf(today()), -7*(KEEP_WEEKS-1));
  for (const k of Object.keys(data.weeks)) if (k < oldest) delete data.weeks[k];
}
function store() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert("Не удалось сохранить данные"); }
}
function save() { W().updatedAt = Date.now(); prune(); store(); scheduleSync(); }       // изменилась неделя
function saveDebts() { D().updatedAt = Date.now(); store(); scheduleSync(); }           // изменились долги

let week = mondayOf(today());
function W() { return data.weeks[week] || (data.weeks[week] = { shifts: [] }); }

// ---------- расчёт зарплаты ----------
function shiftPay(s) {
  if (s.sales === null || s.sales === "" || s.sales === undefined) return MIN_PAY; // продажи ещё не внесены
  return Number(s.sales) < MIN_SALES ? MIN_PAY : Number(s.sales) * PERCENT;
}

// ---------- расчёт долгов ----------
function person(id) { return D().people.find(p => p.id === id); }
function bossOf(point) { return D().people.find(p => (p.points || []).includes(point)); }
function toKZT(amount, cur) { return cur === "RUB" ? amount * D().rates.RUB : amount; }
function itemOrder(a, b) { return (a.due || "9999").localeCompare(b.due || "9999") || a.date.localeCompare(b.date); }

// Сколько погашено по каждому долгу: сначала платежи на конкретный долг, остальные — по порядку сроков
function allocate() {
  const paid = {};
  for (const it of D().items) paid[it.id] = 0;
  for (const p of D().people) {
    const items = D().items.filter(i => i.personId === p.id).sort(itemOrder);
    const pays = D().payments.filter(x => x.personId === p.id).sort((a,b) => a.date.localeCompare(b.date));
    let free = 0;
    for (const x of pays) {
      if (x.itemId && paid[x.itemId] !== undefined) paid[x.itemId] += Number(x.amount) || 0;
      else free += Number(x.amount) || 0;
    }
    for (const it of items) {
      const need = Math.max(0, it.amount - paid[it.id]);
      const take = Math.min(need, free); paid[it.id] += take; free -= take;
    }
    if (free > 0 && items.length) paid[items[items.length-1].id] += free; // переплата
  }
  return paid;
}
function personBalance(p, paid) {
  const items = D().items.filter(i => i.personId === p.id);
  const total = items.reduce((s, i) => s + i.amount, 0);
  const left = items.reduce((s, i) => s + Math.max(0, i.amount - paid[i.id]), 0);
  return { items, total, left };
}
function weekPayments(k) { return D().payments.filter(x => x.week === k); }

// ---------- элементы ----------
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e[k] = v; else e[k] = v;
  }
  for (const c of kids) if (c !== null && c !== undefined) e.append(c);
  return e;
}
function field(labelText, input, cls) { return el("div", { class: cls || "" }, el("label", { textContent: labelText }), input); }
function select(options, val, onChange) {
  const s = el("select");
  for (const [v, t] of options) s.append(el("option", { value: v, textContent: t }));
  if (val !== undefined) s.value = val;
  if (onChange) s.onchange = () => onChange(s.value);
  return s;
}
function pointSelect(val, onChange) { return select(POINTS.map(p => [p, p]), val, onChange); }
function numInput(val, placeholder, onChange) {
  const i = el("input", { type: "number", inputMode: "numeric", min: "0", placeholder });
  i.value = (val === null || val === undefined || val === 0) ? "" : val;
  if (onChange) i.oninput = () => onChange(i.value === "" ? null : Number(i.value));
  return i;
}
function dateInput(val, onChange, limitWeek) {
  const i = el("input", { type: "date", value: val || "" });
  if (limitWeek) { i.min = week; i.max = addDays(week, 6); }
  if (onChange) i.onchange = () => onChange(i.value);
  return i;
}
function delBtn(question, action) { return el("button", { class: "del", textContent: "Удалить", onclick: () => { if (confirm(question)) action(); } }); }

// ================= ЗАРПЛАТА =================
function render() {
  const w = W();
  document.getElementById("weekTitle").textContent = dm(week) + " – " + dm(addDays(week,6));
  document.getElementById("payday").textContent = "Выплата: пн " + dm(addDays(week,7));
  document.getElementById("prev").disabled = week <= addDays(mondayOf(today()), -7*(KEEP_WEEKS-1));

  // смены
  const box = document.getElementById("shifts"); box.innerHTML = "";
  w.shifts.sort((a,b) => a.date.localeCompare(b.date));
  if (!w.shifts.length) box.innerHTML = '<div class="muted">Смен нет</div>';
  for (const s of w.shifts) {
    const pay = el("div");
    const upd = () => {
      const noSales = s.sales === null || s.sales === undefined;
      pay.innerHTML = "<b>" + money(shiftPay(s)) + "</b> <span class='muted'>" +
        (noSales ? "минималка, продажи не внесены" : (s.sales < MIN_SALES ? "минималка" : "20%")) +
        (s.courier ? " · курьер +" + money(s.courier) : "") + "</span>";
      renderTotals();
    };
    const g = el("div", { class: "grid" },
      field("Дата", dateInput(s.date, v => { if (v) { s.date = v; save(); render(); } }, true)),
      field("Точка", pointSelect(s.point, v => { s.point = v; save(); renderTotals(); })),
      field("Продажи, ₸", numInput(s.sales, "не внесено", v => { s.sales = v; save(); upd(); })),
      field("Курьер (платил сам), ₸", numInput(s.courier, "0", v => { s.courier = v || 0; save(); upd(); }))
    );
    g.style.marginTop = "8px";
    box.append(el("div", { class: "item" },
      el("div", { class: "row" }, pay, delBtn("Удалить смену?", () => { w.shifts = w.shifts.filter(x => x !== s); save(); render(); })), g));
    upd();
  }

  // авансы этой недели (хранятся в долгах)
  const ab = document.getElementById("advances"); ab.innerHTML = "";
  const advs = D().items.filter(i => i.advance && i.week === week);
  if (!advs.length) ab.innerHTML = '<div class="muted">Авансов нет</div>';
  for (const a of advs) {
    const head = el("div", { html: "<b>" + money(a.amount || 0) + "</b> <span class='muted'>долг: " + (person(a.personId) || {}).name + "</span>" });
    const g = el("div", { class: "grid" },
      field("Дата", dateInput(a.date, v => { if (v) { a.date = v; saveDebts(); } }, true)),
      field("Точка (кто выдал)", pointSelect(a.point, v => { a.point = v; a.personId = bossOf(v).id; saveDebts(); render(); })),
      field("Сумма, ₸", numInput(a.amount, "0", v => { a.amount = v || 0; head.querySelector("b").textContent = money(a.amount); saveDebts(); renderTotals(); }))
    );
    g.style.marginTop = "8px";
    ab.append(el("div", { class: "item" },
      el("div", { class: "row" }, head, delBtn("Удалить аванс?", () => { D().items = D().items.filter(x => x !== a); saveDebts(); render(); })), g));
  }
  renderTotals();
}

function weekSummary(k) {
  const w = data.weeks[k] || { shifts: [] };
  const by = {};
  const get = p => by[p] || (by[p] = { pay: 0, courier: 0, ded: 0, shifts: [] });
  for (const s of w.shifts) { const r = get(s.point); r.pay += shiftPay(s); r.courier += Number(s.courier) || 0; r.shifts.push(s); }
  const pays = weekPayments(k);
  for (const x of pays) if (x.deduction) get(x.point).ded += Number(x.kzt) || 0;
  let pay = 0, courier = 0, ded = 0;
  for (const r of Object.values(by)) { pay += r.pay; courier += r.courier; ded += r.ded; }
  const other = pays.filter(x => !x.deduction);
  const spent = other.reduce((s, x) => s + (Number(x.kzt) || 0), 0);
  const payout = pay + courier - ded;
  return { by, pay, courier, ded, payout, other, spent, food: D().food || 0, left: payout - (D().food || 0) - spent };
}

function renderTotals() {
  const S = weekSummary(week);
  let rows = "";
  for (const p of POINTS) if (S.by[p]) {
    const r = S.by[p];
    rows += `<tr><td>${p}</td><td>${money(r.pay)}</td><td class="plus">${r.courier ? "+"+money(r.courier) : "—"}</td><td class="minus">${r.ded ? "−"+money(r.ded) : "—"}</td><td><b>${money(r.pay + r.courier - r.ded)}</b></td></tr>`;
  }
  document.getElementById("byPoint").innerHTML = rows ? "<tr><th>Точка</th><th>ЗП</th><th>Курьер</th><th>Вычет</th><th>Итого</th></tr>" + rows : "";
  document.getElementById("total").textContent = money(S.payout);
  const pending = W().shifts.filter(s => s.sales === null || s.sales === undefined).length;
  document.getElementById("totalNote").textContent = pending ? `Без продаж: ${pending} смен(ы), посчитаны по минималке` : "";

  // куда уходит зарплата
  const sp = document.getElementById("spend"); sp.innerHTML = "";

  sp.append(line("К выплате", money(S.payout)));
  sp.append(line("Еда и дорога", "−" + money(S.food)));
  for (const x of S.other) {
    const p = person(x.personId) || { name: "?" };
    const txt = p.name + (p.currency === "RUB" ? ` (${money(x.amount, "RUB")})` : "");
    const row = el("div", { class: "line" }, el("span", { textContent: txt }),
      el("span", {}, "−" + money(x.kzt), el("button", { class: "del small", textContent: "✕", onclick: () => {
        if (confirm("Удалить платёж?")) { D().payments = D().payments.filter(y => y !== x); saveDebts(); render(); renderDebts(); } } })));
    sp.append(row);
  }
  for (const x of weekPayments(week).filter(x => x.deduction)) {
    const p = person(x.personId) || { name: "?" };
    sp.append(el("div", { class: "line muted" }, el("span", { textContent: "Вычет " + p.name + " (" + x.point + ") — уже в «к выплате»" }),
      el("span", {}, money(x.kzt), el("button", { class: "del small", textContent: "✕", onclick: () => {
        if (confirm("Удалить вычет?")) { D().payments = D().payments.filter(y => y !== x); saveDebts(); render(); renderDebts(); } } }))));
  }
  sp.append(line("Остаток на руках", money(S.left), "total" + (S.left < 0 ? " minus" : "")));
}

// ---------- отчёт начальству ----------
function extrasText(courier, adv) {
  return [adv ? "аванса" : "", courier ? "курьера" : ""].filter(Boolean).join(" и ");
}
function buildReport() {
  const S = weekSummary(week), paid = allocate();
  const lines = ["Отчёт за " + dm(week) + " – " + dm(addDays(week,6))];
  const bossDone = new Set();
  for (const p of POINTS) {
    const r = S.by[p];
    const advs = D().items.filter(i => i.advance && i.week === week && i.point === p);
    if (!r && !advs.length) continue;
    lines.push("", p + ":");
    const R = r || { pay: 0, courier: 0, ded: 0, shifts: [] };
    for (const s of R.shifts.sort((a,b) => a.date.localeCompare(b.date))) {
      const noSales = s.sales === null || s.sales === undefined;
      lines.push(fmtDate(s.date) + " — " + (noSales ? "не внесено" : n(s.sales)) + " → " + n(shiftPay(s)));
    }
    lines.push("Итого " + p + ": " + n(R.pay) + " ₸");
    if (R.courier || R.ded) {
      if (R.courier) lines.push("Курьер: +" + n(R.courier));
      if (R.ded) lines.push("Аванс: −" + n(R.ded));
      lines.push("Итого " + p + " с учётом " + extrasText(R.courier, R.ded) + ": " + n(R.pay + R.courier - R.ded) + " ₸");
    }
    for (const a of advs) lines.push("Взял аванс " + dm(a.date) + ": " + n(a.amount) + " ₸");
    const boss = bossOf(p);
    if (boss && !bossDone.has(boss.id)) {
      bossDone.add(boss.id);
      const b = personBalance(boss, paid);
      if (b.total) lines.push("Долг (" + boss.name + "): осталось " + n(b.left) + " ₸");
    }
  }
  lines.push("", "Всего: " + n(S.pay) + " ₸");
  if (S.courier || S.ded) lines.push("Всего к выплате с учётом " + extrasText(S.courier, S.ded) + ": " + n(S.payout) + " ₸");
  return lines.join("\n");
}
document.getElementById("copyReport").onclick = async () => {
  const text = buildReport(), btn = document.getElementById("copyReport");
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = el("textarea", { value: text }); document.body.append(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  btn.textContent = "Скопировано ✓"; setTimeout(() => btn.textContent = "Скопировать отчёт", 1500);
};

// ================= ДОЛГИ =================
function renderDebts() {
  const d = D(), paid = allocate();
  let leftKZT = 0, totalKZT = 0, leftRUB = 0;
  for (const it of d.items) {
    const p = person(it.personId); if (!p) continue;
    const left = Math.max(0, it.amount - paid[it.id]);
    leftKZT += toKZT(left, p.currency); totalKZT += toKZT(it.amount, p.currency);
    if (p.currency === "RUB") leftRUB += left;
  }
  document.getElementById("debtTotal").textContent = money(leftKZT);
  document.getElementById("debtTotalAlt").textContent = "≈ " + money(leftKZT / d.rates.RUB, "RUB") + " · ≈ $" + (leftKZT / d.rates.USD).toFixed(2) +
    (leftRUB ? " · из них в рублях " + money(leftRUB, "RUB") : "");
  const pct = totalKZT ? Math.round((1 - leftKZT / totalKZT) * 100) : 0;
  document.getElementById("debtBar").style.width = pct + "%";
  document.getElementById("debtPaid").textContent = "Отдано " + money(totalKZT - leftKZT) + " из " + money(totalKZT) + " (" + pct + "%)";

  // прогноз: средний платёж в неделю за последние 4 недели
  const from = addDays(today(), -28);
  const recent = d.payments.filter(x => x.date >= from && x.date <= today());
  const last4 = recent.reduce((s, x) => s + (Number(x.kzt) || 0), 0);
  // делим на число недель, за которые есть история (от 1 до 4)
  const first = recent.reduce((m, x) => x.date < m ? x.date : m, today());
  const span = Math.min(4, Math.max(1, Math.ceil((parse(today()) - parse(first)) / 864e5 / 7)));
  const perWeek = last4 / span;
  const fc = document.getElementById("forecast");
  if (leftKZT <= 0) fc.innerHTML = "<b class='done'>Долгов нет ✓</b>";
  else if (perWeek <= 0) fc.innerHTML = "<span class='muted'>Прогноз появится после первых платежей.</span>";
  else {
    const weeks = Math.ceil(leftKZT / perWeek);
    fc.innerHTML = "Темп: ≈ " + money(perWeek) + " в неделю (по последним платежам).<br>Прогноз: всё закроешь к <b>" +
      dm(addDays(today(), weeks * 7)) + "." + parse(addDays(today(), weeks * 7)).getFullYear() + "</b> (≈ " + weeks + " нед.)";
  }

  // сроки
  const due = document.getElementById("dueList"); due.innerHTML = "";
  const open = d.items.filter(i => i.due && i.amount - paid[i.id] > 0).sort(itemOrder);
  if (!open.length) due.innerHTML = "<div class='muted'>Нет долгов со сроком</div>";
  for (const it of open) {
    const p = person(it.personId), days = Math.round((parse(it.due) - parse(today())) / 864e5);
    const cls = days < 0 ? "minus" : days <= 7 ? "warn" : "";
    const when = days < 0 ? "просрочен на " + (-days) + " дн." : days === 0 ? "сегодня" : "через " + days + " дн.";
    due.append(el("div", { class: "line" },
      el("span", { html: "<b>" + p.name + "</b> " + (it.title !== "Долг" ? "<span class='muted'>" + it.title + "</span>" : "") }),
      el("span", { class: cls, html: money(it.amount - paid[it.id], p.currency) + "<br><span class='muted'>до " + dm(it.due) + ", " + when + "</span>" })));
  }

  // люди
  const box = document.getElementById("people"); box.innerHTML = "";
  const list = d.people.map(p => ({ p, b: personBalance(p, paid) })).sort((a, b) => (b.b.left > 0) - (a.b.left > 0) || toKZT(b.b.left, b.p.currency) - toKZT(a.b.left, a.p.currency));
  for (const { p, b } of list) {
    const det = el("details");
    if (openPeople.has(p.id)) det.open = true;
    det.ontoggle = () => det.open ? openPeople.add(p.id) : openPeople.delete(p.id);
    const sum = b.left > 0 ? money(b.left, p.currency) + (p.currency === "RUB" ? " <span class='muted'>≈" + money(toKZT(b.left, "RUB")) + "</span>" : "")
                           : (b.total ? "<span class='done'>закрыт ✓</span>" : "<span class='muted'>нет долга</span>");
    det.append(el("summary", {}, el("span", { textContent: p.name + ((p.points || []).length ? " · " + p.points.join(", ") : "") }), el("span", { html: sum })));
    const inner = el("div", { style: "margin-top:8px" });
    // долги человека
    for (const it of b.items.sort(itemOrder)) {
      const left = Math.max(0, it.amount - paid[it.id]);
      const g = el("div", { class: "grid" },
        field("Что", el("input", { type: "text", value: it.title, onchange: e => { it.title = e.target.value || "Долг"; saveDebts(); renderDebts(); } })),
        field("Сумма, " + CUR[p.currency], numInput(it.amount, "0", null)),
        field("Взял", dateInput(it.date, v => { if (v) { it.date = v; saveDebts(); } })),
        field("Срок", dateInput(it.due, v => { it.due = v; saveDebts(); renderDebts(); })));
      const amt = g.querySelectorAll("input")[1];
      amt.onchange = () => { it.amount = Number(amt.value) || 0; saveDebts(); renderDebts(); render(); };
      g.style.marginTop = "6px";
      inner.append(el("div", { class: "item" },
        el("div", { class: "row" }, el("span", { html: left > 0 ? "Осталось <b>" + money(left, p.currency) + "</b>" : "<span class='done'>закрыт ✓</span>" }),
          delBtn("Удалить этот долг?", () => { d.items = d.items.filter(x => x !== it); saveDebts(); renderDebts(); render(); })), g));
    }
    // история платежей
    const pays = d.payments.filter(x => x.personId === p.id).sort((a, b) => b.date.localeCompare(a.date));
    if (pays.length) {
      inner.append(el("h3", { textContent: "История платежей" }));
      for (const x of pays) {
        const it = x.itemId && d.items.find(i => i.id === x.itemId);
        const info = dm(x.date) + (it ? " · " + it.title : "") + (x.deduction ? " · вычет из ЗП" : x.week ? " · из ЗП " + weekLabel(x.week) : "");
        inner.append(el("div", { class: "line" }, el("span", { class: "muted", textContent: info }),
          el("span", {}, money(x.amount, p.currency) + (p.currency === "RUB" ? " (" + money(x.kzt) + ")" : ""),
            el("button", { class: "del small", textContent: "✕", onclick: () => {
              if (confirm("Удалить платёж?")) { d.payments = d.payments.filter(y => y !== x); saveDebts(); renderDebts(); render(); } } }))));
      }
    }
    const formBox = el("div");
    inner.append(el("div", { class: "actions", style: "margin-top:10px" },
      el("button", { class: "small", textContent: "Отдать", onclick: () => payForm(formBox, { personId: p.id }) }),
      el("button", { class: "ghost small", textContent: "Взял ещё", onclick: () => debtForm(formBox, p.id) }),
      !b.items.length && !pays.length && !(p.points || []).length ? el("button", { class: "del small", textContent: "Удалить человека", onclick: () => {
        d.people = d.people.filter(x => x !== p); saveDebts(); renderDebts(); } }) : null), formBox);
    det.append(inner);
    box.append(det);
  }

  for (const [id, key] of [["rateRUB", "RUB"], ["rateUSD", "USD"]]) {
    const i = document.getElementById(id); if (document.activeElement !== i) i.value = d.rates[key];
  }
  const fi = document.getElementById("foodSet"); if (document.activeElement !== fi) fi.value = d.food;
}

// По каждой неделе и по блоку долгов берём ту версию, что изменена позже
function merge(local, remote) {
  const out = { weeks: {} };
  let fromServer = false;
  const rw = remote.weeks || {};
  for (const k of new Set([...Object.keys(local.weeks), ...Object.keys(rw)])) {
    const a = local.weeks[k], b = rw[k];
    const pick = !b ? a : !a ? b : ((a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b);
    if (pick !== a && JSON.stringify(pick) !== JSON.stringify(a)) fromServer = true;
    out.weeks[k] = pick;
  }
  const a = local.debts, b = remote.debts;
  // при равенстве (например, оба — начальные данные) берём серверную версию
  out.debts = !b ? a : (a.updatedAt || 0) > (b.updatedAt || 0) ? a : b;
  if (out.debts !== a && JSON.stringify(out.debts) !== JSON.stringify(a)) fromServer = true;
  return { merged: out, fromServer };
}
async function api(method, body) {
  const r = await fetch("api/data", { method, headers: { "Content-Type": "application/json", "x-password": sync.password },
    body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if (r.status === 401) throw new Error("auth");
  if (r.status !== 200 && r.status !== 409) throw new Error("http " + r.status);
  return { status: r.status, json: await r.json() };
}
async function doSync() {
  if (!sync.password || !canSync) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setStatus("синхронизация…");
  try {
    let server = (await api("GET")).json, changed = false;
    for (let i = 0; i < 5; i++) {
      const m = merge(data, server.data);
      if (m.fromServer) changed = true;
      data = m.merged;
      const before = JSON.stringify(data.debts);
      migrateAdvances();
      if (JSON.stringify(data.debts) !== before) data.debts.updatedAt = Date.now();
      prune(); store();
      if (JSON.stringify(data) === JSON.stringify(server.data)) break;
      const r = await api("PUT", { baseRev: server.rev, data });
      if (r.status === 200) break;
      server = r.json; // конфликт — сливаем ещё раз
    }
    if (changed) { render(); renderDebts(); } // перерисовываем, только если пришли изменения с другого устройства
    setStatus("✓ " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    if (e.message === "auth") { setStatus("неверный пароль"); sync.password = ""; saveSync(); showSync(); }
    else setStatus("нет связи, данные сохранены на устройстве");
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; doSync(); }
}
function showSync() {
  document.getElementById("syncForm").hidden = !!sync.password;
  document.getElementById("syncOnBox").hidden = !sync.password;
  if (!canSync) setStatus("доступно только на сайте");
}
document.getElementById("syncOn").onclick = () => {
  const v = document.getElementById("syncPass").value.trim(); if (!v) return;
  sync.password = v; saveSync(); showSync(); doSync();
};
document.getElementById("syncOff").onclick = () => { sync.password = ""; saveSync(); showSync(); setStatus("выключена"); };
document.getElementById("syncNow").onclick = doSync;
document.addEventListener("visibilitychange", () => { if (!document.hidden) doSync(); });
window.addEventListener("online", doSync);
